<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://inhwadbibwkakacdvoxu.supabase.co wss://inhwadbibwkakacdvoxu.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'none'"
    />
    <title>360 Corporate · Private register</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="vendor/supabase.min.js" defer></script>
    <script src="shared-session.js" defer></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip" href="#workspace">Skip to register</a>
    <aside class="rail" aria-label="Main navigation">
      <a class="brand" href="./" aria-label="360 Corporate home"
        ><span class="brand-dial">360<span>°</span></span
        ><span>CORPORATE</span></a
      >
      <nav id="navigation"></nav>
      <div class="rail-bottom">
        <span class="seal">PRIVATE REGISTER</span
        ><span id="identity-status">Verifying identity</span
        ><a href="../" class="hub-link">← 360 Apps</a>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <span class="eyebrow"
          >360 SOLUTIONS <span class="slash">/</span> CORPORATE</span
        >
        <div class="top-actions">
          <span class="private-dot">Owner access only</span
          ><button
            id="refresh"
            class="icon-button"
            aria-label="Refresh register"
          >
            ↻
          </button>
        </div>
      </header>
      <main id="workspace" tabindex="-1"></main>
      <footer>PRIVATE BY DESIGN <span>360 CORPORATE · v1.1.1</span></footer>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="editor" aria-labelledby="dialog-title"></dialog>
    <section
      id="print-sheet"
      aria-label="Printable entity fact sheet"
    ></section>
  </body>
</html>
