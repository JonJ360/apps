<!doctype html>

<head>

<body>
<div class="mast"><header><a class="brand" href="./" aria-label="360 Apps home"><span class="brand-mark">360</span><span class="brand-type">APPS<span>Application Hub</span></span></a><span class="ver">v1.09</span></header><div class="intro"><div class="eyebrow">360 SOLUTIONS · YOUR WORKSPACE</div><h1>Your apps.<br>One place.</h1><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="appSearch" type="search" aria-label="Find an application" placeholder="Find an application…"></label></div></div><main><section><div class="section-head"><h2>Business applications</h2><span id="appCount" aria-live="polite"></span></div><div class="grid" id="live"></div><p class="empty" id="noMatches" hidden role="status">No matching applications. Try another search.</p></section><details class="planned"><summary>Coming later <span id="comingCount"></span></summary><div class="grid" id="soon"></div></details></main><footer>360 Solutions · Application Hub</footer>
<script>
// ====== EDIT THIS LIST ======
const APPS=[
  {glyph:"CORP", name:"Corporate", desc:"Companies, officers, documents", url:"https://jonj360.github.io/apps/corporate/", live:true, ownerUid:"b605d98f-498e-4a94-94cf-e055ed2b5fcc"},
  {glyph:"INV", name:"SMI Inventory", desc:"TEST / PRACTICE · 2025 count sheets · approved accounts", url:"https://jonj360.github.io/SMI-Inventory/", live:true},
  {glyph:"FS",   name:"Financial Statements", desc:"Statements, charts, Excel and PDF",       url:"https://jonj360.github.io/financial-statements/", live:true},
  {glyph:"AR",   name:"AR Collections CRM",   desc:"Aging, collections, BBC",                 url:"https://jonj360.github.io/SMI-AR-CRM/",          live:true},
  {glyph:"AP",   name:"Accounts Payable SMI/SFAB", desc:"Payables, payment planning, vendor follow-up", url:"https://jonj360.github.io/SMI-AP-CRM/", live:true, ownerUid:"b605d98f-498e-4a94-94cf-e055ed2b5fcc"},
  {glyph:"SMI",  name:"SMI Sales Dashboard",  desc:"Live SMI sales intelligence",             url:"https://jonj360.github.io/SMI-Sales-Dashboard/", live:true},
  {glyph:"SFAB", name:"SFAB Sales Dashboard", desc:"Live Structural Fab sales intelligence", url:"https://jonj360.github.io/SFAB-Sales-Dashboard/",live:true},
  {glyph:"AST",  name:"Asset Register",        desc:"Vehicles, titles, insurance",             url:"https://jonj360.github.io/assets/",              live:true},
  {glyph:"TT",   name:"Time Tracker",          desc:"360 billing time",                        url:"https://jonj360.github.io/timetracker/",         live:true},
  {glyph:"RCP",  name:"Receipt Tracker",       desc:"Snap, code, reimburse",                    url:"https://jonj360.github.io/receipts/",            live:true},
  {glyph:"20R",  name:"20 Foot Rebar Logger",  desc:"20-foot rebar production logging",        url:"#",                                              live:false},
  {glyph:"DT",   name:"Detailer Tracker",      desc:"Replacement planned",                     url:"#",                                              live:false},
  {glyph:"DMG",  name:"Damage Log",             desc:"Equipment and vehicle damage tracking",    url:"#",                                              live:false}
];
// ============================
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const card=a=>`<a class="app${a.live?"":" soon"}" href="${esc(a.url)}">
  <span class="glyph">${esc(a.glyph)}</span>
  <span class="nm">${esc(a.name)}</span>
  <span class="ds">${esc(a.desc)}</span></a>`;
// Visibility only: each destination must still enforce its own backend authorization.
function renderApps(verifiedUser=null){
  const visible=APPS.filter(a=>!a.ownerUid||a.ownerUid===verifiedUser?.id);
  document.getElementById("live").innerHTML=visible.filter(a=>a.live).map(card).join("");
  document.getElementById("soon").innerHTML=visible.filter(a=>!a.live).map(card).join("")||'<span class="ds" style="color:var(--muted);font-size:12px">Nothing queued.</span>';
}
renderApps();
</script>
<p id="identity-status" style="max-width:728px;margin:0 auto 20px;color:var(--muted);font-size:12px" role="status">Checking your existing 360 sign-in…</p>

</body>
</html>
